name: Refresh public sources

on:
  schedule:
    # 04:15 ART (UTC-3); GitHub cron is evaluated in UTC.
    - cron: "15 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run sources whose refresh interval has elapsed
        run: python scripts/run_sources.py --due
      - name: Report source health
        if: always()
        run: python scripts/source_audit.py
